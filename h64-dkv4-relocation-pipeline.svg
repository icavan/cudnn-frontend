<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6a7785"/></marker></defs><rect width="1200" height="1040" fill="white"/><style>text{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;fill:#26333f;font-size:18px}.title{font-size:30px}.sub{font-size:15px;fill:#667582}.section{font-size:21px;font-weight:400}.small{font-size:15px}.tiny{font-size:13px;fill:#667582}</style><text x="42" y="50" class="title">dKV4 relocation: a shorter dependency chain</text><text x="42" y="80" class="sub">SM100 · H64 · Dqk 576 · Dv 512 · KV tile 64 · single-CTA kernel</text><text x="42" y="108" class="sub">Same mathematics. Same atomic count. Different TMEM ownership.</text><path d="M42 130H1158" stroke="#d9dfe4"/><text x="42" y="163" class="section">01   Move the tail out of the main dKV reuse chain</text><text x="42" y="200" class="small">TMEM columns</text><text x="278" y="200" class="small">0–63</text><text x="574" y="200" class="small">64–127</text><text x="870" y="200" class="small">128–191</text><text x="42" y="240" class="">Before</text><text x="42" y="317" class="">After</text><rect x="260" y="213" width="278" height="64" fill="#e4eef7" stroke="#d1d9df" stroke-width=".8"/><text x="274" y="240" class="">S / dP</text><text x="274" y="262" class="small">score-column region</text><rect x="556" y="213" width="278" height="64" fill="#f8e5d6" stroke="#d1d9df" stroke-width=".8"/><text x="570" y="240" class="">dKV0 → dKV4 → dKV2</text><text x="570" y="262" class="small">one serial reuse chain</text><rect x="852" y="213" width="278" height="64" fill="#e3efdf" stroke="#d1d9df" stroke-width=".8"/><text x="866" y="240" class="">dKV1 → dKV3</text><rect x="260" y="290" width="278" height="64" fill="#e8e0f3" stroke="#d1d9df" stroke-width=".8"/><text x="274" y="317" class="">S / dP → dKV4</text><text x="274" y="339" class="small">reuse after compute is done</text><rect x="556" y="290" width="278" height="64" fill="#f8e5d6" stroke="#d1d9df" stroke-width=".8"/><text x="570" y="317" class="">dKV0 → dKV2</text><text x="570" y="339" class="small">tail no longer aliases this region</text><rect x="852" y="290" width="278" height="64" fill="#e3efdf" stroke="#d1d9df" stroke-width=".8"/><text x="866" y="317" class="">dKV1 → dKV3</text><text x="260" y="379" class="tiny">Column-level view; S and dP use different TMEM lane addresses. dQ region omitted.</text><path d="M42 402H1158" stroke="#d9dfe4"/><text x="42" y="437" class="section">02   Replace two serial handoffs with useful overlap</text><text x="42" y="466" class="sub">Schematic dependency order — widths are not measured durations.</text><text x="42" y="514" class="section">Before</text><rect x="178" y="487" width="170" height="64" fill="#f8e5d6" stroke="#d1d9df" stroke-width=".8"/><text x="192" y="514" class="">MMA dKV01</text><rect x="378" y="487" width="170" height="64" fill="#e1f0ed" stroke="#d1d9df" stroke-width=".8"/><text x="392" y="514" class="">T2R 01</text><text x="392" y="536" class="small">free main columns</text><rect x="578" y="487" width="170" height="64" fill="#e8e0f3" stroke="#d1d9df" stroke-width=".8"/><text x="592" y="514" class="">MMA dKV4</text><rect x="778" y="487" width="170" height="64" fill="#e1f0ed" stroke="#d1d9df" stroke-width=".8"/><text x="792" y="514" class="">T2R 4</text><text x="792" y="536" class="small">free same columns</text><rect x="978" y="487" width="170" height="64" fill="#e3efdf" stroke="#d1d9df" stroke-width=".8"/><text x="992" y="514" class="">MMA dKV23</text><path d="M348 519L375 519" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M548 519L575 519" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M748 519L775 519" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M948 519L975 519" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><text x="178" y="579" class="small">Tail production and dKV23 production both depend on a preceding T2R handoff.</text><text x="42" y="631" class="section">After</text><text x="42" y="668" class="small">MMA · w16</text><text x="42" y="745" class="small">T2R · w8–15</text><rect x="178" y="637" width="170" height="60" fill="#f8e5d6" stroke="#d1d9df" stroke-width=".8"/><text x="192" y="664" class="">dKV01</text><rect x="378" y="637" width="220" height="60" fill="#e8e0f3" stroke="#d1d9df" stroke-width=".8"/><text x="392" y="664" class="">dKV4</text><text x="392" y="686" class="small">dead score columns</text><rect x="628" y="637" width="250" height="60" fill="#e3efdf" stroke="#d1d9df" stroke-width=".8"/><text x="642" y="664" class="">dKV23: value part</text><text x="642" y="686" class="small">reuse main columns</text><rect x="908" y="637" width="240" height="60" fill="#e4eef7" stroke="#d1d9df" stroke-width=".8"/><text x="922" y="664" class="">Next S</text><text x="922" y="686" class="small">then dKV23: key part</text><rect x="378" y="716" width="220" height="60" fill="#e1f0ed" stroke="#d1d9df" stroke-width=".8"/><text x="392" y="743" class="">T2R 01 + fence</text><rect x="628" y="716" width="250" height="60" fill="#e1f0ed" stroke="#d1d9df" stroke-width=".8"/><text x="642" y="743" class="">T2R 4 + fence</text><path d="M348 667L375 667" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M598 667L625 667" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M878 667L905 667" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M348 683L375 731" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M598 745L628 695" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M598 683L628 730" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><path d="M878 745L908 695" fill="none" stroke="#6a7785" stroke-width="1.2" marker-end="url(#a)"/><text x="380" y="804" class="small">Tail MMA overlaps T2R 01</text><text x="630" y="804" class="small">Value MMA overlaps T2R 4</text><path d="M42 825H1158" stroke="#d9dfe4"/><text x="42" y="860" class="section">03   Keep the safety edges; move the waits later</text><text x="42" y="894" class="small">T2R 01 done → dKV23 overwrite</text><text x="610" y="894" class="small">T2R 4 done + P released + next K ready → next S</text><text x="42" y="927" class="small">After fenced T2R, global atomics use registers; TMEM need not stay live until atomics finish.</text><text x="42" y="956" class="small">Early K release already exists. Next-score pre-issue is a companion scheduling change.</text><path d="M42 976H1158" stroke="#d9dfe4"/><text x="42" y="1004" class="small">dKV4 = Qtailᵀ · dS     [64,64] × [64,64] → [64,64] FP32     ·     reverse traversal: next tile = t−1</text><text x="42" y="1026" class="tiny">Sources: upstream 68358074 vs simplified local candidate · offsets L138–153 · MMA L1809–1884 · reducer L2318–2347</text></svg>
